services:
  - type: web
    name: civicfix-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SLA_CRON_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MEDIA_STORAGE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: cron
    name: civicfix-sla-processor
    runtime: node
    plan: free
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: npm ci --include=dev
    startCommand: >-
      node -e "fetch(process.env.CIVICFIX_API_URL + '/api/sla/process',
      {method:'POST',headers:{'x-sla-cron-secret':process.env.SLA_CRON_SECRET}})
      .then(async r => { console.log(r.status, await r.text()); if (!r.ok) process.exit(1) })
      .catch(e => { console.error(e); process.exit(1) })"
    envVars:
      - key: CIVICFIX_API_URL
        sync: false
      - key: SLA_CRON_SECRET
        sync: false

  - type: web
    name: civicfix-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
